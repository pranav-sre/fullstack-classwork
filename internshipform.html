<!DOCTYPE html>
<html lang="en">
<head>
    <title>Internship Application Form</title>
</head>

<body style="background-color: bisque; text-align: center;"> 
    <h1>Internship Application Form</h1>
    
    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- Personal Details -->
        <h3>Personal Details</h3>
        <div>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        </div>
        <br>
        
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>
        <br>
        
        <div>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>
        <br>
        
        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>
        <br>
        
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>
        <br>

        <!-- Gender -->
        <h3>Gender</h3>
        <div>
            <input type="radio" id="genderMale" name="gender" value="Male" required>
            <label for="genderMale">Male</label>
            
            <input type="radio" id="genderFemale" name="gender" value="Female">
            <label for="genderFemale">Female</label>
            
            <input type="radio" id="genderOther" name="gender" value="Other">
            <label for="genderOther">Other</label>
        </div>
        <br>

        <!-- Course Dropdown -->
        <h3>Education</h3>
        <div>
            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Choose your course</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="Mechanical">Mechanical</option>
            </select>
        </div>
        <br>

        <!-- Skills Checkboxes -->
        <h3>Skills</h3>
        <div>
            <input type="checkbox" id="skillJava" name="skills" value="Java">
            <label for="skillJava">Java</label>
            
            <input type="checkbox" id="skillJS" name="skills" value="JavaScript">
            <label for="skillJS">JavaScript</label>
            
            <input type="checkbox" id="skillHTML" name="skills" value="HTML">
            <label for="skillHTML">HTML</label>
            
            <input type="checkbox" id="skillCSS" name="skills" value="CSS">
            <label for="skillCSS">CSS</label>
            
            <input type="checkbox" id="skillReact" name="skills" value="React">
            <label for="skillReact">React</label>
        </div>
        <br>

        <!-- Internship Preference -->
        <h3>Internship Preference</h3>
        <div>
            <input type="radio" id="prefRemote" name="preference" value="Remote" required>
            <label for="prefRemote">Remote</label>
            
            <input type="radio" id="prefOnsite" name="preference" value="On-site">
            <label for="prefOnsite">On-site</label>
            
            <input type="radio" id="prefHybrid" name="preference" value="Hybrid">
            <label for="prefHybrid">Hybrid</label>
        </div>
        <br>

        <!-- Resume Upload -->
        <h3>Application Documents</h3>
        <div>
            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
        </div>
        <br>

    
        <div>
            <label for="coverLetter">Cover Letter:</label><br>
            <textarea id="coverLetter" name="coverLetter" rows="5" cols="40" placeholder="Write your cover letter here..." required></textarea>
        </div>
        <br>

        <!-- Submit and Reset Buttons -->
        <div>
            <button type="submit">Submit Application</button>
            <button type="reset">Reset Form</button>
        </div>

    </form>
    </bgcolor>
</body>
</html>
